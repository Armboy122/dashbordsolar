<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="290" viewBox="0 0 1040 290"><rect width="1040" height="290" rx="16" fill="#f4f6f5"/><text x="24" y="38" font-family="Sarabun,Thonburi,sans-serif" font-size="23" fill="#0a4536">สถานะงาน แยกจากความสำคัญและคุณภาพข้อมูล</text><rect x="20" y="70" width="236.5" height="180" rx="10" fill="white" stroke="#c9d9d1"/><circle cx="48" cy="100" r="16" fill="#0f5c46"/><text x="48" y="106" text-anchor="middle" fill="white" font-size="18" font-family="sans-serif">1</text><text x="36" y="140" font-family="Sarabun,Thonburi,sans-serif" font-size="22" fill="#17293f">รอตรวจ</text><text x="36" y="171" font-family="Sarabun,Thonburi,sans-serif" font-size="17" fill="#52637a">เปิดงานจากหลักฐาน</text><text x="36" y="202" font-family="Sarabun,Thonburi,sans-serif" font-size="17" fill="#52637a">ยังไม่แจ้งช่างก็ได้</text><text x="259.5" y="165" fill="#0f5c46" font-size="20">→</text><rect x="274.5" y="70" width="236.5" height="180" rx="10" fill="white" stroke="#c9d9d1"/><circle cx="302.5" cy="100" r="16" fill="#0f5c46"/><text x="302.5" y="106" text-anchor="middle" fill="white" font-size="18" font-family="sans-serif">2</text><text x="290.5" y="140" font-family="Sarabun,Thonburi,sans-serif" font-size="22" fill="#17293f">แจ้งช่างแล้ว</text><text x="290.5" y="171" font-family="Sarabun,Thonburi,sans-serif" font-size="17" fill="#52637a">ผู้ดูแลยืนยันเอง</text><text x="290.5" y="202" font-family="Sarabun,Thonburi,sans-serif" font-size="17" fill="#52637a">ไม่ใช่สถานะ LINE</text><text x="514" y="165" fill="#0f5c46" font-size="20">→</text><rect x="529" y="70" width="236.5" height="180" rx="10" fill="white" stroke="#c9d9d1"/><circle cx="557" cy="100" r="16" fill="#0f5c46"/><text x="557" y="106" text-anchor="middle" fill="white" font-size="18" font-family="sans-serif">3</text><text x="545" y="140" font-family="Sarabun,Thonburi,sans-serif" font-size="22" fill="#17293f">ได้ผลตรวจ</text><text x="545" y="171" font-family="Sarabun,Thonburi,sans-serif" font-size="17" fill="#52637a">บันทึกสิ่งที่ช่างพบ</text><text x="545" y="202" font-family="Sarabun,Thonburi,sans-serif" font-size="17" fill="#52637a">ไม่ได้แปลว่าซ่อมจบ</text><text x="768.5" y="165" fill="#0f5c46" font-size="20">→</text><rect x="783.5" y="70" width="236.5" height="180" rx="10" fill="white" stroke="#c9d9d1"/><circle cx="811.5" cy="100" r="16" fill="#0f5c46"/><text x="811.5" y="106" text-anchor="middle" fill="white" font-size="18" font-family="sans-serif">4</text><text x="799.5" y="140" font-family="Sarabun,Thonburi,sans-serif" font-size="22" fill="#17293f">ติดตามต่อ</text><text x="799.5" y="171" font-family="Sarabun,Thonburi,sans-serif" font-size="17" fill="#52637a">เปิดงานเดิมกลับมา</text><text x="799.5" y="202" font-family="Sarabun,Thonburi,sans-serif" font-size="17" fill="#52637a">รักษาประวัติทุกครั้ง</text></svg>